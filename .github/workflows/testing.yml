name: Testing

on:
  push:
    paths-ignore:
      - 'docs/**'
    branches:
      - main
  pull_request:
    branches:
      - main
    paths-ignore:
      - 'docs/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-no-extras:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]  #macos-latest fails downloads, see #593
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v6

      - run: git remote set-branches origin 'main'

      - run: git fetch --depth 1

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install main package & dependencies
        run: uv pip install -e .[dev]
        env:
          UV_SYSTEM_PYTHON: 1

      - name: Show installed packages
        run: uv pip list

      - name: Run test-suite
        run: python -m pytest -v

  test-deps-2024:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v6

      - run: git remote set-branches origin 'main'

      - run: git fetch --depth 1

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      # Resolve as of Dec 2024, when the old hand-pinned set was chosen. Build,
      # docs tooling, and scikit-base are exempt: setuptools>=78.1.1 and
      # mkdocstrings>=0.29 are required but were released after the cutoff,
      # and tabnet_model.py/test_tabnet.py use scikit-base APIs
      # (skbase.utils.dependencies._safe_import, skbase.utils.git_diff) that
      # postdate the pinned scikit-base release available in Dec 2024.
      - name: Install main package & dependencies
        run: >
          uv pip install -e .[dev]
          --exclude-newer-package "setuptools=false"
          --exclude-newer-package "mkdocstrings=false"
          --exclude-newer-package "mkdocstrings-python=false"
          --exclude-newer-package "mkdocs-autorefs=false"
          --exclude-newer-package "scikit-base=false"
        env:
          UV_SYSTEM_PYTHON: 1
          UV_EXCLUDE_NEWER: "2024-12-10"

      - name: Show installed packages
        run: uv pip list

      - name: Run test-suite
        run: python -m pytest -v

  test-all-extras:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]  #macos-latest fails downloads, see #593
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v6

      - run: git remote set-branches origin 'main'

      - run: git fetch --depth 1

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set min. dependencies
        if: matrix.requires == 'oldest'
        run: |
          import os
          fname = 'requirements/base.txt'
          lines = [line.replace('>=', '==') for line in open(fname).readlines()]
          open(fname, 'w').writelines(lines)
        shell: python

      - name: Install main package & dependencies
        run: uv pip install -e .[dev,extra]
        env:
          UV_SYSTEM_PYTHON: 1

      - name: Show installed packages
        run: uv pip list

      - name: Restore test's datasets
        uses: actions/cache/restore@v5
        with:
          path: tests/.datasets
          key: test-datasets

      - name: Run test-suite
        run: python -m pytest -v

      - name: Save test's datasets
        uses: actions/cache/save@v5
        with:
          path: tests/.datasets
          key: test-datasets
